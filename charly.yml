# pod-crabbox-browser — the browser lease image for the Crabbox containerd
# provider.
#
# One repo per image (W5.2). The image imports the base lease image at a PINNED
# tag, so the image tag and the git tag name the same build:
# ghcr.io/opencharly/pod-crabbox-browser:<tag> is the tree tagged <tag>.
repo: github.com/opencharly/pod-crabbox-browser
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - pac
import: []
discover:
    - path: candy
      recursive: true

pod-crabbox-browser:
    candy:
        description: |
            The browser lease image for a Crabbox `containerd` lease: the base
            `pod-crabbox` contract with Chromium and Firefox installed and a
            `/usr/local/bin/crabbox-browser` wrapper that launches Chromium with its
            sandbox ENABLED. On crun/runc the host runs the lease with the narrow
            `/etc/containerd/seccomp/crabbox-userns.json` profile (which restores
            `unshare`/`clone` while leaving `keyctl`/`mount` enforced), and under krun
            the guest kernel is the boundary; this image never passes `--no-sandbox`
            and never asks for `seccomp=unconfined`.
        base: ghcr.io/opencharly/pod-crabbox:2026.307.1828
        # An OCI base does not inherit the parent's distro/build values, so the
        # CachyOS chain is declared here; the base image is itself CachyOS.
        distro:
            - cachyos
            - arch
        # PID 1 is the base image's `sshd -D`, which must run as root; the LOGIN
        # user stays `crabbox` (uid 1000), created by the inherited candy.
        user: root
        uid: 0
        gid: 0
        candy:
            - crabbox-browser

# =============================================================================
# check-pod-crabbox-browser-runs — the disposable R10 bed for the browser lease
# image.
#
# The image's own `check:` steps are BUILD-scope: they assert Chromium and
# Firefox are installed, report their versions, that the wrapper carries no
# sandbox-disabling flag, and that the inherited lease files exist. A build
# container never launches the browser, so none of them can prove the thing
# this variant exists for: Chromium RUNS inside a running lease, with its
# sandbox ON. This bed does, because the deploy boots the image and the bed
# drives the running system.
#
# The venue is a disposable pod built from the image under review; its container
# and its input volume are torn down with it.
#
# This bed deliberately does NOT claim the containerd substrate: in the pinned
# toolchain a `pod:` deploy's authored `engine:` selector is dropped by the
# check-bed `config`/`start` path (`charly config` emits a podman quadlet) and
# `charly deploy add --engine` is an unknown flag (opencharly/charly#1109).
# What this bed proves is this image's own, engine-independent running contract
# on a disposable pod — the same scope its four sibling beds claim.
#
# Three steps, in the order that makes the bed a gate rather than a snapshot:
#   1. ABSENCE  — reset the state, assert the instruments exist, then prove
#                 Chromium is NOT running (no process, no DevTools listener, no
#                 browser profile) while the lease still REFUSES the freshly
#                 generated key. The instruments are asserted first, so their
#                 silence is a measurement; a venue that does not answer fails
#                 the step instead of reading as "nothing started yet".
#   2. PERFORM  — write the read-only lease inputs temp + mv, run the image's
#                 own shared bootstrap, then start the image's OWN wrapper over
#                 the lease's own SSH path as `crabbox` and capture the DOM it
#                 renders. Starting it any other way would not prove the
#                 contract user can run the launcher.
#   3. PRESENCE — the captured DOM is a rendered document; a persistent Chromium
#                 answers its DevTools endpoint, and its sandboxed children sit
#                 in a different user or PID namespace from PID 1 (the boundary
#                 a `--no-sandbox` launch does not create); the lease contract
#                 still holds over SSH as `crabbox` on 2222 with passwordless
#                 sudo and `/usr/local/libexec/crabbox/ready` exiting 0.
#
# The plan runs at every check-live pass, including the fresh-rebuild pass, so
# step 1 resets and step 2 re-applies: each pass measures its OWN perform.
# =============================================================================
check-pod-crabbox-browser-runs:
    pod:
        image: pod-crabbox-browser
        disposable: true
        lifecycle: test
        description: >-
            R10 witness for the pod-crabbox-browser lease image: a disposable
            container built from the image runs the base lease's direct-mode
            entrypoint, and the bed drives the browser in three steps — ABSENCE
            (Chromium is installed but not running, and the lease refuses the
            key), PERFORM (the shared bootstrap consumes authorized_keys,
            lease.env and bootstrap.sh, and the lease user launches the image's
            own `/usr/local/bin/crabbox-browser` over SSH), and PRESENCE (the
            wrapper renders about:blank to DOM with the sandbox ENABLED — a
            persistent Chromium answers its DevTools endpoint and its sandboxed
            children sit in a different user or PID namespace from PID 1 — and
            the lease holds over SSH as `crabbox` on 2222 with passwordless sudo
            and `/usr/local/libexec/crabbox/ready` exiting 0). A missing
            browser, a launcher that does not render, a degraded sandbox, a
            sandbox-disabling flag on a running Chromium, an unapplied input, a
            missing listener, login user, sudo grant or readiness hook fails the
            bed; a venue that is not answering fails the absence step instead
            of reading as "nothing started yet". The containerd LEASE venue
            (opencharly/charly#1109) and the Docker-compatible socket
            (opencharly/pod-crabbox-nested#1) are explicitly not claimed.
        volume:
            - name: lease-inputs
              type: volume
              path: /crabbox
        plan:
            - check: absence — Chromium is installed but NOT running, and the lease refuses the freshly generated key
              id: browser-absent-before-launch
              context:
                - runtime
              timeout: 180s
              command:
                  command: |
                      set -euo pipefail
                      # The instruments must exist before their silence means
                      # anything: this image is expected to ship Chromium and the
                      # launcher, and the direct-mode base to keep sshd as PID 1.
                      test -x /usr/bin/chromium
                      test -x /usr/local/bin/crabbox-browser
                      test "$(ps -p 1 -o comm=)" = sshd
                      # Reset whatever an earlier pass left behind. Stop the
                      # browser by its exact process name, never by a
                      # `pkill -f` pattern that also matches this shell's argv.
                      pids=$(pgrep -x chromium 2>/dev/null || true)
                      if [ -n "$pids" ]; then
                        kill -KILL $pids 2>/dev/null || true
                      fi
                      # The plan runs at every check-live pass, and after
                      # `charly update` the container is rebuilt while the named
                      # input volume survives. The bed must measure its OWN
                      # perform, never a leftover one.
                      rm -f /crabbox/authorized_keys /crabbox/lease.env /crabbox/bootstrap.sh
                      # The contract user's home is the passwd entry's field, never a
                      # hardcoded /home/crabbox: this base adopts uid 1000 from the
                      # distro image (measured: crabbox's home is /home/user), so a
                      # hardcoded path would make the absence probe vacuous.
                      home="$(getent passwd crabbox | cut -d: -f6)"
                      test -n "$home"
                      rm -rf "$home/.ssh" "$home/.config/crabbox-chromium"
                      rm -f /var/lib/crabbox/bootstrapped /var/lib/crabbox/lease.env /var/lib/crabbox/bootstrap-marker
                      rm -f /tmp/crabbox-lease-key /tmp/crabbox-lease-key.pub /tmp/crabbox-browser.log /tmp/crabbox-browser-probe.log /tmp/crabbox-browser-dump.html /tmp/crabbox-browser-start.out
                      rm -rf /tmp/crabbox-browser-probe
                      # ABSENCE of the browser: no Chromium process survives the
                      # reset, nothing listens on the DevTools port the presence
                      # step uses, and no browser profile exists yet. A probe that
                      # cannot fail is not an assertion.
                      if pgrep -x chromium >/dev/null 2>&1; then
                        echo "FAIL: a chromium process survives the reset" >&2
                        exit 1
                      fi
                      if ss -ltn 'sport = :9222' | grep -q LISTEN; then
                        echo "FAIL: something is still listening on 9222 before the launch" >&2
                        exit 1
                      fi
                      test ! -e "$home/.config/crabbox-chromium"
                      # ABSENCE of the lease contract: no authorized_keys are
                      # applied and the fresh key is refused by AUTHENTICATION.
                      # A venue that does not answer fails this step instead of
                      # reading as "not applied yet".
                      ssh-keygen -q -t ed25519 -N '' -f /tmp/crabbox-lease-key
                      out=$(ssh -p 2222 -i /tmp/crabbox-lease-key \
                        -o BatchMode=yes -o StrictHostKeyChecking=no \
                        -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 \
                        crabbox@127.0.0.1 true 2>&1 || true)
                      case "$out" in
                        *"Permission denied (publickey"*) ;;
                        *)
                          printf '%s\n' "$out" >&2
                          echo "FAIL: expected the lease to refuse the key over SSH; a venue that does not answer cannot prove the absence" >&2
                          exit 1
                          ;;
                      esac
                      test ! -e "$home/.ssh/authorized_keys"
                      echo "ABSENT: Chromium is installed but not running; the lease refuses the key"
                  in_container: true
            - check: perform — the shared bootstrap consumes the lease inputs, and crabbox renders a page through the image's own wrapper over SSH
              id: browser-performs-the-launch
              context:
                - runtime
              timeout: 300s
              command:
                  command: |
                      set -euo pipefail
                      install -d -m 0755 /crabbox
                      # The consumer writes each input TEMP + mv; the bootstrap
                      # reads each one ONCE. Write the same way, so the bed
                      # exercises the contract's own input path rather than an
                      # in-place rewrite it forbids.
                      install -m 0644 /tmp/crabbox-lease-key.pub /crabbox/.authorized_keys.tmp
                      printf 'crabbox_bed_nonce=%s\n' charly-pod-crabbox-browser-bed > /crabbox/.lease.env.tmp
                      printf '#!/bin/bash\nset -euo pipefail\nprintf "%%s\\n" "$crabbox_bed_nonce" > /var/lib/crabbox/bootstrap-marker\n' > /crabbox/.bootstrap.sh.tmp
                      chmod 0755 /crabbox/.bootstrap.sh.tmp
                      mv /crabbox/.authorized_keys.tmp /crabbox/authorized_keys
                      mv /crabbox/.lease.env.tmp /crabbox/lease.env
                      mv /crabbox/.bootstrap.sh.tmp /crabbox/bootstrap.sh
                      # Direct mode's own shared bootstrap applies the inputs.
                      /usr/local/libexec/crabbox/bootstrap.sh
                      test -f /var/lib/crabbox/bootstrapped
                      test -f /var/lib/crabbox/lease.env
                      marker=$(tr -d '\n' < /var/lib/crabbox/bootstrap-marker)
                      test "$marker" = charly-pod-crabbox-browser-bed
                      # Render a document through the LEASE'S OWN SSH path as
                      # crabbox, using the image's own launcher and NO
                      # sandbox-disabling flag. A Chromium that cannot initialize
                      # its sandbox exits non-zero here, so a rendered document is
                      # itself evidence the sandbox came up.
                      ssh -p 2222 -i /tmp/crabbox-lease-key \
                        -o BatchMode=yes -o StrictHostKeyChecking=no \
                        -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 \
                        crabbox@127.0.0.1 \
                        '/usr/local/bin/crabbox-browser --headless --disable-gpu --dump-dom about:blank' \
                        > /tmp/crabbox-browser-dump.html 2> /tmp/crabbox-browser.log
                      test -s /tmp/crabbox-browser-dump.html
                      grep -qi '<html' /tmp/crabbox-browser-dump.html
                      echo "PERFORMED: the lease bootstrap applied the inputs and crabbox rendered about:blank through crabbox-browser"
                  in_container: true
            - check: presence — Chromium runs WITH its sandbox, renders DOM, and the lease contract holds over SSH as crabbox
              id: browser-runs-with-sandbox-and-lease-holds
              context:
                - runtime
              timeout: 300s
              eventually: 120s
              retry_interval: 2s
              command:
                  command: |
                      set -euo pipefail
                      # The lease contract's own SSH path, as the contract user:
                      # the login name, passwordless sudo and the readiness hook
                      # the consumer polls. These are terms only a usable lease
                      # produces.
                      out=$(ssh -p 2222 -i /tmp/crabbox-lease-key \
                        -o BatchMode=yes -o StrictHostKeyChecking=no \
                        -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 \
                        crabbox@127.0.0.1 \
                        'id -un && sudo -n true && echo SUDO_OK && /usr/local/libexec/crabbox/ready && echo READY_OK')
                      printf '%s\n' "$out"
                      printf '%s\n' "$out" | grep -qx crabbox
                      printf '%s\n' "$out" | grep -qx SUDO_OK
                      printf '%s\n' "$out" | grep -qx READY_OK
                      # The perform step's own render is a DOCUMENT, not an empty
                      # capture. A browser that exits before painting cannot
                      # produce this.
                      test -s /tmp/crabbox-browser-dump.html
                      grep -qi '<html' /tmp/crabbox-browser-dump.html
                      # Start a persistent headless Chromium so the sandbox can be
                      # inspected while it runs. The guard makes the launch
                      # idempotent across the runner's retries; a fresh profile
                      # keeps it off the launcher's profile, which the perform's
                      # one-shot render already released.
                      if ! curl -fsS --max-time 2 http://127.0.0.1:9222/json/version >/dev/null 2>&1; then
                        ssh -p 2222 -i /tmp/crabbox-lease-key \
                          -o BatchMode=yes -o StrictHostKeyChecking=no \
                          -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 \
                          crabbox@127.0.0.1 \
                          'setsid nohup /usr/bin/chromium --headless --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/crabbox-browser-probe about:blank >/tmp/crabbox-browser-probe.log 2>&1 </dev/null & echo STARTED' \
                          > /tmp/crabbox-browser-start.out
                        grep -qx STARTED /tmp/crabbox-browser-start.out
                      fi
                      # The browser ANSWERS its DevTools endpoint: a listener
                      # alone is not an answer, which is why this is not a
                      # `test -S` or a process-name match.
                      if ! body=$(curl -fsS --max-time 5 http://127.0.0.1:9222/json/version); then
                        echo "FAIL: the sandbox-probe Chromium did not answer its DevTools endpoint" >&2
                        echo "--- /tmp/crabbox-browser-probe.log ---" >&2
                        tail -60 /tmp/crabbox-browser-probe.log >&2 || true
                        exit 1
                      fi
                      printf 'devtools: %s\n' "$body"
                      printf '%s\n' "$body" | grep -Eq '"Browser": *"Chrom'
                      # THE SANDBOX IS ON. A sandboxed Chromium places its zygote
                      # and renderers in a NESTED PID namespace; the kernel
                      # reports that in `/proc/<pid>/status` as a multi-field
                      # NSpid line (a `--no-sandbox` launch creates no nested
                      # namespace, so its line has one field and this assertion
                      # fails — negative control run on a live deploy). NSpid is
                      # read from the world-readable status file because the
                      # namespace symlinks need CAP_SYS_PTRACE, which podman's
                      # default capability set excludes (measured). The needle
                      # is split so this scanning shell's own argv does not
                      # match.
                      found=0
                      for p in /proc/[0-9]*; do
                        pid=${p##*/}
                        [ "$pid" = "$$" ] && continue
                        cmd=$(tr '\0' ' ' < "$p/cmdline" 2>/dev/null || true)
                        case "$cmd" in
                          *--type=zygote*|*--type=renderer*)
                            nspid=$(sed -n 's/^NSpid:[[:space:]]*//p' "$p/status" 2>/dev/null || true)
                            levels=$(printf '%s\n' "$nspid" | wc -w)
                            if [ "$levels" -ge 2 ]; then
                              found=1
                              printf 'sandboxed child pid %s: NSpid %s\n' "$pid" "$nspid"
                            fi
                            ;;
                        esac
                      done
                      test "$found" = 1
                      # No running Chromium carries a sandbox-disabling flag.
                      needle_no="--no""-sandbox"
                      needle_suid="--disable""-setuid-sandbox"
                      for p in /proc/[0-9]*; do
                        cmd=$(tr '\0' ' ' < "$p/cmdline" 2>/dev/null || true)
                        case "$cmd" in
                          *chromium*)
                            case "$cmd" in
                              *"$needle_no"*|*"$needle_suid"*)
                                echo "FAIL: a running Chromium carries a sandbox-disabling flag: $cmd" >&2
                                exit 1
                                ;;
                            esac
                            ;;
                        esac
                      done
                      # The perform pass's own lease work was consumed by the
                      # shared bootstrap this bed ran.
                      test -f /var/lib/crabbox/bootstrapped
                      marker=$(tr -d '\n' < /var/lib/crabbox/bootstrap-marker)
                      test "$marker" = charly-pod-crabbox-browser-bed
                      echo "PRESENT: Chromium runs with its sandbox, renders about:blank, and the lease holds over SSH"
                  in_container: true
